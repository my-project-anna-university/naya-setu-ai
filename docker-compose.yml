# ============================================
# NyayaSetu — Docker Compose
# Orchestrates Frontend, Backend & MongoDB
# ============================================
#
# Usage:
#   docker compose up -d --build     # Build & start all services
#   docker compose down              # Stop all services
#   docker compose logs -f           # Tail logs
#
# Access:
#   Frontend:  http://localhost:3000
#   Backend:   http://localhost:5000
#   MongoDB:   mongodb://localhost:27017/nyayasetu
# ============================================

services:
  # ---------- MongoDB ----------
  mongo:
    image: mongo:7
    container_name: nyayasetu-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nyayasetu-net

  # ---------- Backend API ----------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nyayasetu-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/nyayasetu
      - JWT_SECRET=${JWT_SECRET:-nyayasetu_docker_jwt_secret_2026}
      - CLIENT_URL=http://localhost:3000
      # Free AI Agent Keys (optional — paste your free keys here or in .env)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    networks:
      - nyayasetu-net

  # ---------- Frontend (Nginx) ----------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nyayasetu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - nyayasetu-net

# ---------- Volumes ----------
volumes:
  mongo_data:
    driver: local

# ---------- Networks ----------
networks:
  nyayasetu-net:
    driver: bridge
